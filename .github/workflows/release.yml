# Builds Runner Thermo for Windows and Mac on GitHub's own computers.
#
# Push a version tag (git tag v2.0.0 && git push origin v2.0.0) and this:
#   1. compiles the code and runs the physics tests on Windows and on a Mac
#   2. packages a Windows app (Runner Thermo.exe) and a Mac app (Runner Thermo.app)
#   3. attaches both as downloads on the repo's Releases page, plus a plain .jar
#
# You can also run it by hand from the Actions tab ("Run workflow") to test a build
# without making a release; the files then appear under that run's Artifacts.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            icon: assets/AppIcon.ico
          - os: macos-latest
            platform: macos
            icon: assets/AppIcon.icns
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile and run the physics tests
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          javac --release 17 -d out/classes $(find src -name "*.java")
          javac --release 17 -cp out/classes -d out/test $(find test -name "*.java")
          java -cp "out/classes${SEP}out/test" runnersim.PhysicsTests

      - name: Package the app
        shell: bash
        run: |
          mkdir -p out/jar
          jar --create --file out/jar/runner-thermo-sim.jar --main-class runnersim.App -C out/classes .
          jpackage --type app-image \
            --name "Runner Thermo" \
            --input out/jar \
            --main-jar runner-thermo-sim.jar \
            --main-class runnersim.App \
            --icon "${{ matrix.icon }}" \
            --dest dist

      - name: Zip it (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Runner Thermo" -DestinationPath "Runner-Thermo-windows.zip"

      - name: Zip it (Mac)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          codesign --force --deep --sign - "dist/Runner Thermo.app"
          ditto -c -k --keepParent "dist/Runner Thermo.app" "Runner-Thermo-macos.zip"

      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Runner-Thermo-${{ matrix.platform }}
          path: Runner-Thermo-${{ matrix.platform }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Runner-Thermo-${{ matrix.platform }}.zip
            ${{ matrix.platform == 'windows' && 'out/jar/runner-thermo-sim.jar' || '' }}
